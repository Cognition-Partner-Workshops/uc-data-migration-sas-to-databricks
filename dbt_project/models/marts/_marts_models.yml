version: 2

models:
  - name: mart_daily_transactions
    description: >
      Enriched daily transactions with running balance.
      Migrated from daily_transaction_processing.sas.

  - name: mart_risk_scores
    description: >
      Credit risk scores with PD/LGD/EAD and risk ratings.
      Migrated from credit_risk_scoring.sas.

  - name: mart_transaction_anomalies
    description: >
      Z-score anomaly detection on daily transactions.
      Migrated from daily_transaction_processing.sas (Step 3).

  - name: mart_regulatory_rwa
    description: >
      Monthly Risk-Weighted Assets by account type and segment.
      Basel III standardized approach risk weights.
      Migrated from monthly_regulatory_reporting.sas (Step 1).
    columns:
      - name: report_month
        description: "Reporting period (YYYYMM)"
        tests:
          - not_null
      - name: account_type
        tests:
          - not_null
      - name: risk_weight
        description: "Basel III risk weight: 0.00–1.00"
        tests:
          - not_null
      - name: total_exposure
        description: "Sum of current_balance for the group"
      - name: rwa
        description: "Risk-weighted assets = exposure × risk_weight"

  - name: mart_delinquency_aging
    description: >
      Delinquency aging buckets (Current/1-29/30-59/60-89/90-119/120-179/180+).
      Migrated from monthly_regulatory_reporting.sas (Step 2).
    columns:
      - name: report_month
        tests:
          - not_null
      - name: delinq_bucket
        description: "Delinquency aging bucket"
        tests:
          - not_null
          - accepted_values:
              values: ['Current', '1-29', '30-59', '60-89', '90-119', '120-179', '180+', 'Unknown']
      - name: n_accounts
        description: "Count of accounts in bucket"
        tests:
          - not_null
      - name: total_balance
        description: "Sum of balances in bucket"
      - name: total_past_due
        description: "Sum of past-due amounts in bucket"

  - name: mart_loss_ratios
    description: >
      Loss ratio summary by line of business (policy type).
      Migrated from policy_valuation.sas (Step 5).
      PROC MEANS aggregation → SQL GROUP BY.
    columns:
      - name: policy_type
        description: "Insurance line of business"
        tests:
          - unique
          - not_null
      - name: n_policies
        description: "Count of in-force policies"
        tests:
          - not_null
      - name: total_earned
        description: "Total YTD earned premium"
      - name: agg_loss_ratio
        description: "Aggregate loss ratio = total_incurred / total_earned"
      - name: agg_combined_ratio
        description: "Aggregate combined ratio = loss_ratio + 30% expense load"

  - name: mart_customer_pnl
    description: >
      Customer-level P&L: interest income, fees, credit loss, net profit.
      Migrated from customer_profitability.sas (Steps 1-4).
      Multi-source MERGE BY → multi-ref LEFT JOIN.
    columns:
      - name: customer_id
        description: "Primary key — unique customer"
        tests:
          - unique
          - not_null
      - name: net_interest_income
        description: "Lending income minus deposit cost"
        tests:
          - not_null
      - name: total_revenue
        description: "Net interest income + fee income"
        tests:
          - not_null
      - name: net_profit
        description: "Total revenue - operating cost - ECL"
        tests:
          - not_null
      - name: profit_tier
        description: "Highly Profitable / Profitable / Marginal / Unprofitable"
        tests:
          - not_null
          - accepted_values:
              values: ['Highly Profitable', 'Profitable', 'Marginal', 'Unprofitable']
      - name: report_month
        tests:
          - not_null
